<!doctype html>
<!--
  Documento de entrada servido por Vite. Conserva el contenedor donde main.jsx monta React.
  El doctype permanece primero para que el navegador interprete HTML en modo estándar.
-->
<html lang="es-AR">

<head>
  <!-- UTF-8 admite los caracteres en español; viewport adapta el tamaño a pantallas móviles. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyecto Ludopatía</title>
</head>

<body>
  <!-- React administrará el contenido de root; las páginas no se escriben en este HTML. -->
  <div id="root"></div>
  <!-- La entrada es un módulo: sus imports conectan App, fuentes y estilos globales. -->
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
